[project]
name = "clearmic-studio"
version = "1.0.0"
description = "Native Apple Silicon real-time 48 kHz voice isolation, target-speaker lock, and CoreAudio virtual microphone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.30.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "soxr>=0.5.0",
    "safetensors>=0.4.3",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "voxlock>=0.1.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
restorer = [
    "torch>=2.4.0",
    "coremltools>=8.0",
    "clearvoice>=0.1.0",
]
